name: Build SuperSU

on:
    push:
        branches: [main, master, app]
    pull_request:
        branches: [main, master, app]
    workflow_dispatch:

jobs:
    build:
        runs-on: windows-latest

        permissions:
            contents: write

        strategy:
            matrix:
                build_type: [release]

        steps:
            - name: Task :check:checkOut
              uses: actions/checkout@v4
              with:
                  submodules: recursive
                  fetch-depth: 1

            - name: Task :setup:installDependencies
              shell: pwsh
              run: |
                  Write-Host "Initializing Windows Build Environment..."
                  choco install python --version=3.11.2 -y
                  refreshenv

            - name: Task :cache:cacheGradle
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.gradle/caches
                      ~/.gradle/wrapper
                  key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
                  restore-keys: |
                      gradle-${{ runner.os }}-

            - name: Task :setup:installJava
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 21
                  cache: gradle

            - name: Task :app:buildApk
              shell: pwsh
              run: |
                  $ErrorActionPreference = "Continue"
                  $global:failedSteps = 0

                  Write-Host "SUPERSU WINDOWS BUILD PIPELINE INITIALIZED"
                  Write-Host "Starting comprehensive build execution..."
                  
                  if ("${{ matrix.build_type }}" -eq "release") {
                      Write-Host "Executing python build.py with release flags and stacktrace..."
                      python build.py -vr --stacktrace app
                      if ($LASTEXITCODE -ne 0) {
                          Write-Error "Build step failed with exit code $LASTEXITCODE"
                          $global:failedSteps++
                      }
                  } else {
                      Write-Host "Executing python build.py with debug flags and stacktrace..."
                      python build.py -v --stacktrace app
                      if ($LASTEXITCODE -ne 0) {
                          Write-Error "Build step failed with exit code $LASTEXITCODE"
                          $global:failedSteps++
                      }
                  }

                  if ($global:failedSteps -gt 0) {
                      Write-Host "BUILD PIPELINE ENCOUNTERED ERRORS"
                      Write-Host "Total Failed Operations: $global:failedSteps"
                      exit $global:failedSteps
                  } else {
                      Write-Host "BUILD PIPELINE COMPLETED SUCCESSFULLY"
                  }

            - name: Task :stop:stopGradle
              shell: pwsh
              run: |
                  $ErrorActionPreference = "Continue"
                  Write-Host "Stopping Gradle daemon gracefully..."
                  if (Test-Path "./app/gradlew.bat") {
                      ./app/gradlew.bat --stop
                  } elseif (Test-Path "./gradlew.bat") {
                      ./gradlew.bat --stop
                  } else {
                      Write-Host "Gradle wrapper not found, skipping stop command."
                  }

            - name: Task :upload:uploadArtifact
              uses: actions/upload-artifact@v4
              with:
                  name: magisk_${{ matrix.build_type }}
                  path: out/app-release.apk

            - name: Task :publish:writeGithubRelease
              shell: pwsh
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  $ErrorActionPreference = "Continue"
                  Write-Host "Starting GitHub release synchronization process..."

                  if ("${{ matrix.build_type }}" -eq "release") {
                      $tag = "SuperSU"
                      $file = "out/app-release.apk"
                  } else {
                      $tag = "canary_build"
                      $file = "out/app-debug.apk"
                  }

                  $commit = git rev-parse --short HEAD
                  $branch = $env:GITHUB_REF -replace 'refs/heads/', ''
                  $buildTime = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd HH:mm:ss UTC")
                  
                  $body = "SuperSU automated build on Windows environment`n`nBranch: $branch`nCommit: $commit`nBuild type: ${{ matrix.build_type }}`nBuild time: $buildTime`nActor: $($env:GITHUB_ACTOR)`nRepository: $($env:GITHUB_REPOSITORY)"

                  Write-Host "Cleaning up existing remote and local tags..."
                  gh release delete "$tag" -y 2>&1
                  git tag -d "$tag" 2>&1
                  git push origin ":refs/tags/$tag" 2>&1

                  Write-Host "Creating new git tag and GitHub release..."
                  git tag "$tag"
                  git push origin "$tag"
                  
                  gh release create "$tag" "$file" --title "$tag" --notes "$body"
                  if ($LASTEXITCODE -ne 0) {
                      Write-Error "Failed to publish GitHub release."
                      exit 1
                  } else {
                      Write-Host "Release published successfully."
                  }
