name: Build SuperSU

on:
    push:
        branches: [main, master, app]
    pull_request:
        branches: [main, master, app]
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-24.04

        permissions:
            contents: write

        strategy:
            matrix:
                build_type: [release]

        steps:
            - name: Task :check:checkOut
              uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
              with:
                  submodules: recursive
                  fetch-depth: 1

            - name: Task :setup:installDependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y python3 gh

            - name: Task :cache:cacheGradle
              uses: actions/cache@0c45773b623bea8c8e75f6c82b208c3cf94ea4f9
              with:
                  path: |
                      ~/.gradle/caches
                      ~/.gradle/wrapper
                  key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
                  restore-keys: |
                      gradle-${{ runner.os }}-

            - name: Task :setup:installJava
              uses: actions/setup-java@99b8673f64920e3231b438473a800d0246a3d132
              with:
                  distribution: temurin
                  java-version: 21
                  cache: gradle

            - name: Task :app:buildApk
              run: |
                  if [ "${{ matrix.build_type }}" = "release" ]; then
                      python build.py -vr app
                  else
                      python build.py -v app
                  fi

            - name: Task :upload:uploadArtifact
              uses: actions/upload-artifact@65146301eaa10a99be372ea1b5a0977001074341
              with:
                  name: magisk_${{ matrix.build_type }}
                  path: out/app-release.apk
                  compression-level: 9

            - name: Task :publish:writeGithubRelease
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  if [ "${{ matrix.build_type }}" = "release" ]; then
                      tag="SuperSU"
                      file="out/app-release.apk"
                  else
                      tag="canary_build"
                      file="out/app-debug.apk"
                  fi
                  commit=$(git rev-parse --short HEAD)
                  branch=${GITHUB_REF#refs/heads/}
                  build_time=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
                  body=$(printf "SuperSU automated build\n\nBranch: %s\nCommit: %s\nBuild type: %s\nBuild time: %s\nActor: %s\nRepository: %s\n" \
                      "$branch" \
                      "$commit" \
                      "${{ matrix.build_type }}" \
                      "$build_time" \
                      "$GITHUB_ACTOR" \
                      "$GITHUB_REPOSITORY")
                  gh release delete "$tag" -y || true
                  git tag -d "$tag" || true
                  git push origin :refs/tags/$tag || true
                  git tag "$tag"
                  git push origin "$tag"
                  gh release create "$tag" "$file" \
                      --title "$tag" \
                      --notes "$body"
